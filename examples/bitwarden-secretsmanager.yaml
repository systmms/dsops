version: 1

# Example configuration for the Bitwarden Secrets Manager provider (the
# separate Bitwarden product for CI/CD, distinct from the Password Manager
# `bitwarden` provider).
#
# Prerequisites:
#   1. Install the bws CLI: https://bitwarden.com/help/secrets-manager-cli/
#   2. Issue a Machine Account access token in your Bitwarden Secrets Manager
#      organization and export it: export BWS_ACCESS_TOKEN=...
#
# Tokens are NEVER read from yaml. The `access_token_env` setting names an
# env var, not a token value.

secretStores:
  bw-sm:
    type: bitwarden.secretsmanager
    # access_token_env: BWS_ACCESS_TOKEN     # default
    # server_url: https://vault.bitwarden.com  # for self-hosted Bitwarden

envs:
  production:
    # Resolve by secret UUID (preferred for stability)
    DATABASE_URL:
      from:
        store: store://bw-sm/11111111-1111-4111-8111-111111111111

    # Resolve by <projectName>/<secretKey> path
    API_KEY:
      from:
        store: store://bw-sm/production/API_KEY

    # The .note field of a secret can be retrieved via field=note on the
    # reference. (Useful when the value field holds the secret and the note
    # holds rotation metadata or human-readable context.)
    DB_PASSWORD_NOTE:
      from:
        store: store://bw-sm/22222222-2222-4222-8222-222222222222
        field: note
